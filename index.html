  <!-- Live Countdown Script starting at 14:35 -->
  <script>
    (function () {
      const timerDisplay = document.getElementById('countdown-timer');
      // 14 minutes and 35 seconds = 875 seconds
      let remainingSeconds = 14 * 60 + 35;

      function updateTimer() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        const formattedMin = String(minutes).padStart(2, '0');
        const formattedSec = String(seconds).padStart(2, '0');
        timerDisplay.textContent = `${formattedMin}:${formattedSec}`;

        if (remainingSeconds > 0) {
          remainingSeconds--;
        } else {
          // Reset loop smoothly if timer reaches 00:00
          remainingSeconds = 14 * 60 + 35;
        }
      }

      // Tick every 1 second
      setInterval(updateTimer, 1000);
    })();
  </script>
